name: Field workbench acceptance
on:
  push:
    branches: ['work/field-workbench-alpha-20261007']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:workbench
      - run: python scripts/verify_evidence.py
      - run: npm run check && npm run build
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-field.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-workbench-test-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: field-workbench-review-site
          path: dist/
